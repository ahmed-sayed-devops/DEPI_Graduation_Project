
name: FireGrill CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check JavaScript Syntax
        run: |
          node --check server.js
          node --check db.js
          node --check models/order.js
          node --check models/product.js
          node --check models/user.js
