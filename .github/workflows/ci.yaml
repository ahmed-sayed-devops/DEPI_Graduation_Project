name: FireGrill CI

on:
  workflow_dispatch:

concurrency:
  group: firegrill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Install and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Get Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: application/backend/package-lock.json

      - name: Install Dependencies
        working-directory: application/backend
        run: npm ci

      - name: Check JavaScript Syntax
        working-directory: application/backend
        run: |
          node --check server.js
          node --check db.js
          node --check models/order.js
          node --check models/product.js
          node --check models/user.js

  Docker-Publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Get Source Code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.USERNAME }} -p ${{ secrets.PASSWD }}

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t fadel87/firegrill:backend-v${{ github.run_number }} \
            -f application/backend/Dockerfile \
            application/backend

      - name: Push Backend Docker Image
        run: docker push fadel87/firegrill:backend-v${{ github.run_number }}

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t fadel87/firegrill:frontend-v${{ github.run_number }} \
            -f application/frontend/Dockerfile \
            application/frontend

      - name: Push Frontend Docker Image
        run: docker push fadel87/firegrill:frontend-v${{ github.run_number }}

  Update-GitOps:
    name: Update GitOps Branch
    runs-on: ubuntu-latest
    needs: Docker-Publish

    steps:
      - name: Get Source Code from GitOps Branch
        uses: actions/checkout@v7
        with:
          ref: gitops
          path: gitops

      - name: Update Backend Image
        run: |
          sed -i '/name: backend/,/image:/ s|image:.*|image: fadel87/firegrill:backend-v${{ github.run_number }}|' gitops/k8s/backend/backend-deployment.yaml

      - name: Update Frontend Image
        run: |
          sed -i '/name: frontend/,/image:/ s|image:.*|image: fadel87/firegrill:frontend-v${{ github.run_number }}|' gitops/k8s/frontend/frontend-deployment.yaml

      - name: Commit and Push GitOps Changes
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/backend/backend-deployment.yaml k8s/frontend/frontend-deployment.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update FireGrill images to build ${{ github.run_number }}"
          git push origin HEAD:gitops
