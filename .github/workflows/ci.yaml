name: FireGrill CI

on:
  workflow_dispatch:

concurrency:
  group: firegrill
  cancel-in-progress: false

permissions:
  contents: write  

jobs:
  build:
    name: Install and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Get Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check JavaScript Syntax
        run: |
          node --check server.js
          node --check db.js
          node --check models/order.js
          node --check models/product.js
          node --check models/user.js

  Docker-Publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Get Source Code
        uses: actions/checkout@v7

      - name: Build Docker Image
        run: docker build -t firegrill/firegrill-app:v${{ github.run_number }} .

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.USERNAME }} -p ${{ secrets.PASSWD }}

      - name: Push Docker Image
        run: docker push firegrill/firegrill-app:v${{ github.run_number }}
