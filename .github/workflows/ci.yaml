
name: FireGrill CI

on:
  workflow_dispatch:

concurrency:
  group: firegrill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Install and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Get Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: application/backend/package-lock.json

      - name: Install Dependencies
        working-directory: application/backend
        run: npm ci

      - name: Check JavaScript Syntax
        working-directory: application/backend
        run: |
          node --check server.js
          node --check db.js
          node --check models/order.js
          node --check models/product.js
          node --check models/user.js

  Docker-Publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Get Source Code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.USERNAME }} -p ${{ secrets.PASSWD }}

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t firegrill/backend:v${{ github.run_number }} \
            -f application/backend/Dockerfile \
            application/backend

      - name: Push Backend Docker Image
        run: docker push fadel87/backend:v${{ github.run_number }}

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t firegrill/frontend:v${{ github.run_number }} \
            -f application/frontend/Dockerfile \
            application/frontend

      - name: Push Frontend Docker Image
        run: docker push fadel87/frontend:v${{ github.run_number }}

  Update-GitOps:
    name: Update GitOps Branch
    runs-on: ubuntu-latest
    needs: Docker-Publish

    steps:
      - name: Get Source Code from GitOps Branch
        uses: actions/checkout@v7
        with:
          ref: gitops
          path: gitops

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
