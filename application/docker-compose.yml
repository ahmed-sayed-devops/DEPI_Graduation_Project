services:
  mongodb:
    image: mongo:7
    container_name: depi-local-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: appuser
      MONGO_INITDB_ROOT_PASSWORD: devpassword123
    volumes:
      - mongo_local_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: depi-local-backend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      MONGO_URI: mongodb://appuser:devpassword123@mongodb:27017/restaurant?authSource=admin
      SESSION_SECRET: local-dev-session-secret-depi-nexus-2026-xyz
      SEED_DATABASE: "true"
      CORS_ORIGIN: "*"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: depi-local-frontend
    ports:
      - "8080:8080"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat << 'NGINX' > /etc/nginx/conf.d/default.conf
        server {
            listen 8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }
            location /api {
                proxy_pass http://backend:3000;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            }
            location / {
                try_files $$uri $$uri/ /index.html;
            }
        }
        NGINX
        exec nginx -g 'daemon off;'
    depends_on:
      - backend

volumes:
  mongo_local_data:
