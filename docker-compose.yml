version: '3.8'

services:
  app:
    build: .
    container_name: node_app
    ports:
      - "3000:3000" # (Host Port : Container Port)
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://db:27017/depi_project
    depends_on:
      - db
    networks:
      - dev_network

  db:
    image: mongo:latest 
    container_name: project_db
    ports:
      - "27017:27017"
    volumes:
      - db_data:/data/db 
    networks:
      - dev_network

networks:
  dev_network:
    driver: bridge

volumes:
  db_data: