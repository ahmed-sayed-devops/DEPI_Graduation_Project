apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: firegrill
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ahmed-sayed-devops/DEPI_Graduation_Project.git
    targetRevision: gitops
    path: k8s
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
